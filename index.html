<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charge Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap');

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222536;
  --border: #2e3348;
  --accent: #4ade80;
  --accent-dim: rgba(74,222,128,0.12);
  --accent2: #60a5fa;
  --text: #e8eaf0;
  --text2: #8b90a8;
  --muted: #4a4f6a;
  --red: #f87171;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sarabun', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.container {
  width: 100%;
  max-width: 420px;
}

/* HEADER */
.header {
  margin-bottom: 28px;
  text-align: center;
}

.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.title {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}

.title span {
  color: var(--accent);
}

/* CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 12px;
}

/* INPUTS */
.field {
  margin-bottom: 18px;
}

.field:last-child { margin-bottom: 0; }

.field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

input[type="number"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 50px 13px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  outline: none;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

input[type="number"]:focus {
  border-color: var(--accent);
}

.unit {
  position: absolute;
  right: 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text2);
  pointer-events: none;
}

/* SOC ROW */
.soc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

/* SLIDER */
.slider-field {
  margin-bottom: 18px;
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.slider-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
}

input[type="range"] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  background: var(--border);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(74,222,128,0.2);
}

/* DIVIDER */
.divider {
  height: 1px;
  background: var(--border);
  margin: 18px 0;
}

/* RESULT */
.result-card {
  background: var(--accent-dim);
  border: 1px solid rgba(74,222,128,0.25);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 12px;
  display: none;
}

.result-card.show { display: block; }

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.result-item {
  text-align: center;
}

.result-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.result-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.result-unit {
  font-size: 12px;
  color: var(--text2);
  margin-top: 3px;
  font-family: 'IBM Plex Mono', monospace;
}

.result-main {
  background: var(--surface);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
}

.result-main-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.result-main-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 38px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}

.result-main-value span {
  font-size: 18px;
  color: var(--text2);
}

/* CALC BTN */
.calc-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #0f1117;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  margin-bottom: 12px;
}

.calc-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.calc-btn:active { transform: translateY(0); }

/* RESET BTN */
.reset-btn {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.2s;
}

.reset-btn:hover { border-color: var(--text2); color: var(--text); }

/* ERROR */
.error-msg {
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--red);
  margin-bottom: 12px;
  display: none;
  font-family: 'IBM Plex Mono', monospace;
}

.error-msg.show { display: block; }

/* HISTORY */
.history-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-top: 12px;
  display: none;
}

.history-card.show { display: block; }

.history-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 14px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.history-item:last-child { border-bottom: none; padding-bottom: 0; }

.history-soc {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text2);
}

.history-kwh {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent2);
  font-weight: 600;
}

.history-thb {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
}

/* SAVED SETTINGS */
.saved-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-top: 6px;
}

/* CROSS-APP NAV LINK */
.app-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--accent2);
  background: rgba(96,165,250,0.1);
  border: 1px solid rgba(96,165,250,0.28);
  padding: 7px 14px;
  border-radius: 999px;
  text-decoration: none;
  margin-top: 14px;
}

.app-link:hover { filter: brightness(1.2); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="eyebrow">EV Charging</div>
    <div class="title">คำนวณ<span>ค่าชาร์จ</span></div>
    <a class="app-link" href="https://xxgui2enxx.github.io/nevo-q05-maintenance/">🔧 ตารางบำรุงรักษา NEVO Q05</a>
  </div>

  <!-- INPUT CARD -->
  <div class="card">

    <!-- Battery Size -->
    <div class="field">
      <label class="field-label">ขนาดแบต</label>
      <div class="input-wrap">
        <input type="number" id="batterySize" value="51.9" min="1" max="200" step="0.1">
        <span class="unit">kWh</span>
      </div>
    </div>

    <!-- SOC -->
    <div class="soc-row">
      <div class="field" style="margin-bottom:0">
        <label class="field-label">ก่อนชาร์จ</label>
        <div class="input-wrap">
          <input type="number" id="socBefore" value="" min="0" max="100" placeholder="0" oninput="syncSlider('before')">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label">หลังชาร์จ</label>
        <div class="input-wrap">
          <input type="number" id="socAfter" value="" min="0" max="100" placeholder="100" oninput="syncSlider('after')">
          <span class="unit">%</span>
        </div>
      </div>
    </div>

    <!-- Price -->
    <div class="field">
      <label class="field-label">ราคาต่อหน่วย</label>
      <div class="input-wrap">
        <input type="number" id="pricePerKwh" value="" min="0" step="0.1" placeholder="เช่น 5.9">
        <span class="unit">฿/kWh</span>
      </div>
    </div>

  </div>

  <!-- ERROR -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- CALC BTN -->
  <button class="calc-btn" onclick="calculate()">⚡ คำนวณ</button>

  <!-- RESULT -->
  <div class="result-card" id="resultCard">
    <div class="result-grid">
      <div class="result-item">
        <div class="result-label">SOC ที่ชาร์จ</div>
        <div class="result-value" id="resSocDiff">—</div>
        <div class="result-unit">%</div>
      </div>
      <div class="result-item">
        <div class="result-label">พลังงานที่ได้</div>
        <div class="result-value" id="resKwh">—</div>
        <div class="result-unit">kWh</div>
      </div>
    </div>
    <div class="result-main">
      <div class="result-main-label">ค่าใช้จ่าย</div>
      <div class="result-main-value" id="resCost">—<span> บาท</span></div>
    </div>
  </div>

  <!-- RESET -->
  <button class="reset-btn" onclick="resetForm()">รีเซ็ต</button>

  <!-- HISTORY -->
  <div class="history-card" id="historyCard">
    <div class="history-title">// ประวัติการคำนวณ</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
let history = [];

function calculate() {
  const battery = parseFloat(document.getElementById('batterySize').value);
  const before = parseFloat(document.getElementById('socBefore').value);
  const after = parseFloat(document.getElementById('socAfter').value);
  const price = parseFloat(document.getElementById('pricePerKwh').value);
  const errEl = document.getElementById('errorMsg');

  // Validate
  if (isNaN(battery) || battery <= 0) {
    showError('กรุณากรอกขนาดแบตให้ถูกต้อง');
    return;
  }
  if (isNaN(before) || before < 0 || before > 100) {
    showError('กรุณากรอก % ก่อนชาร์จ (0–100)');
    return;
  }
  if (isNaN(after) || after < 0 || after > 100) {
    showError('กรุณากรอก % หลังชาร์จ (0–100)');
    return;
  }
  if (after <= before) {
    showError('% หลังชาร์จต้องมากกว่า % ก่อนชาร์จ');
    return;
  }
  if (isNaN(price) || price <= 0) {
    showError('กรุณากรอกราคาต่อหน่วย');
    return;
  }

  errEl.classList.remove('show');

  const socDiff = after - before;
  const kwh = (battery * socDiff / 100);
  const cost = kwh * price;

  // Show result
  document.getElementById('resSocDiff').textContent = socDiff.toFixed(0);
  document.getElementById('resKwh').textContent = kwh.toFixed(2);
  document.getElementById('resCost').innerHTML = cost.toFixed(2) + '<span> บาท</span>';
  document.getElementById('resultCard').classList.add('show');

  // Add to history
  history.unshift({ before, after, socDiff, kwh, cost, price });
  if (history.length > 5) history.pop();
  renderHistory();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
}

function resetForm() {
  document.getElementById('socBefore').value = '';
  document.getElementById('socAfter').value = '';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function renderHistory() {
  if (history.length === 0) return;
  const card = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  card.classList.add('show');
  list.innerHTML = history.map((h, i) => `
    <div class="history-item">
      <span class="history-soc">${h.before}% → ${h.after}% (+${h.socDiff}%)</span>
      <span class="history-kwh">${h.kwh.toFixed(2)} kWh</span>
      <span class="history-thb">${h.cost.toFixed(2)} ฿</span>
    </div>
  `).join('');
}

// Enter key triggers calculate
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});
</script>
</body>
</html>
